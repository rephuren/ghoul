[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ghoul"
version = "0.2.0"
description = "SSH-ловушка с поддельной оболочкой и живым дашбордом"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "misxnthropy" }]
dependencies = ["asyncssh>=2.14"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
ghoul = "ghoul.__main__:main"

[tool.setuptools]
packages = ["ghoul"]

[tool.setuptools.package-data]
ghoul = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
